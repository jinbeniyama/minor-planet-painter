[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minor-planet-painter"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "astropy",
    "astroquery",
    "matplotlib",
    "scipy",
    "pandas",
    "space-classy",
]

[tool.setuptools.packages.find]
include = ["minor_planet_painter*"]

[tool.setuptools]
script-files = [
    "scripts/plot_sssb_xy.py",
    "scripts/plot_sssb_angsize.py",
    "scripts/plot_sssb_Psid_Psyn.py",
    "scripts/plot_lcdb_animation.py",
    "scripts/plot_sssb_spectra.py",
    "scripts/plot_sssb_orbelem.py",
    "scripts/plot_sssb_skymotion.py",
]


[project.scripts]
wget-mpcorb-nea = "minor_planet_painter.wget_MPCORB_NEA:main"
